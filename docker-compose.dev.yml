# WeCast – Dev/Sandbox Docker Compose
# Startet: PostgreSQL, Redis, MinIO
# Backend + Frontend laufen direkt im Host (für einfacheres Debugging)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wecast
      POSTGRES_PASSWORD: wecast_dev
      POSTGRES_DB: wecast
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "wecast"]
      interval: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: wecast_admin
      MINIO_ROOT_PASSWORD: wecast_dev_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      retries: 10
