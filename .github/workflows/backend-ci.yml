name: Backend CI

on:
  push:
    branches: ["**"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wecast
          POSTGRES_PASSWORD: wecast_test
          POSTGRES_DB: wecast_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_NAME: WeCast
      APP_ENV: test
      APP_BASE_URL: http://localhost:8000
      SECRET_KEY: ci-test-secret-key-32-characters-ok
      DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://wecast:wecast_test@localhost:5432/wecast_test
      REDIS_URL: redis://localhost:6379/0
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_SECURE: "false"
      MINIO_BUCKET_MEDIA: wecast-media
      MINIO_BUCKET_HLS: wecast-hls
      MINIO_BUCKET_RECORDINGS: wecast-recordings
      LDAP_ENABLED: "false"
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      JWT_ALGORITHM: HS256
      OLLAMA_ENABLED: "false"
      WHISPER_MODEL: tiny
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      WHISPER_LANGUAGE: de
      LOCAL_ADMIN_USERNAME: admin
      LOCAL_ADMIN_PASSWORD: admin_ci_password
      AUDIT_LOG_ENABLED: "true"
      IP_HASH_SALT: ci-test-salt
      CORS_ORIGINS: http://localhost:3000

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check app/ tests/

      - name: Type check with mypy (non-blocking)
        run: mypy app/ --ignore-missing-imports --no-strict-optional || true

      - name: Run database migrations
        run: alembic upgrade head

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            -x

      - name: Run integration tests
        run: |
          pytest tests/integration/ -v \
            --cov=app \
            --cov-append \
            --cov-report=xml \
            --cov-report=term-missing \
            -x

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  lint-only:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check app/ tests/
      - run: ruff format --check app/ tests/
