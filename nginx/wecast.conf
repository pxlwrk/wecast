# WeCast Nginx Configuration
# Place in /etc/nginx/sites-available/wecast and symlink to sites-enabled/

upstream wecast_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream wecast_frontend {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream wecast_minio {
    server 127.0.0.1:9000;
    keepalive 16;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name wecast.company.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wecast.company.com;

    # ── TLS ──────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/ssl/wecast/fullchain.pem;
    ssl_certificate_key /etc/ssl/wecast/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:WeCastSSL:10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # ── Security Headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Upload Limit ──────────────────────────────────────────────────────────
    client_max_body_size 5G;
    client_body_timeout  300s;

    # ── Rate Limiting ─────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/s;

    # ── Login endpoint: strict rate limit ────────────────────────────────────
    location = /api/v1/auth/login {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://wecast_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── API Backend ───────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://wecast_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        # Disable buffering for streaming responses
        proxy_buffering off;
    }

    # ── HLS Media Streaming (direct from MinIO) ───────────────────────────────
    location /media/hls/ {
        # Strip prefix and proxy to MinIO bucket
        rewrite ^/media/hls/(.*)$ /wecast-hls/$1 break;
        proxy_pass http://wecast_minio;
        proxy_set_header Host $host;
        # Cache HLS segments aggressively
        add_header Cache-Control "public, max-age=3600, s-maxage=3600";
        add_header Access-Control-Allow-Origin "https://wecast.company.com";
    }

    # ── Short URL Redirect ────────────────────────────────────────────────────
    location ~ ^/s/([a-zA-Z0-9-]+)$ {
        proxy_pass http://wecast_api/api/v1/s/$1;
        proxy_set_header Host $host;
    }

    # ── Next.js Frontend ──────────────────────────────────────────────────────
    location / {
        proxy_pass http://wecast_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket support (Next.js HMR in dev)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── Liveness probe ────────────────────────────────────────────────────────
    location = /healthz {
        proxy_pass http://wecast_api/healthz;
        access_log off;
    }
}
