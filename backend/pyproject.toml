[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "wecast-api"
version = "0.1.0"
description = "WeCast Enterprise Media Portal – Backend API"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    # Auth & Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",  # pin: passlib 1.7.x not compatible with bcrypt 4.1+
    "ldap3>=2.9.1",
    # Task Queue
    "arq>=0.26.1",
    "redis>=5.2.0",
    # Object Storage
    "minio>=7.2.10",
    # Media Processing
    "faster-whisper>=1.1.0",
    "aiofiles>=24.1.0",
    "python-multipart>=0.0.17",
    # AI (Ollama)
    "ollama>=0.4.4",
    # Config
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    # Utils
    "httpx>=0.28.0",
    "structlog>=24.4.0",
    "orjson>=3.10.12",
    "Pillow>=11.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
